<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#gameContainer {
  position: relative;
  border: 3px solid #444;
  border-radius: 6px;
  box-shadow: 0 0 40px rgba(0,200,0,0.3);
}
canvas { display: block; background: #1a1a1a; }
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #0f0;
  font-size: 14px;
  pointer-events: none;
  line-height: 1.8;
  text-shadow: 0 0 6px rgba(0,255,0,0.6);
}
#gameOver {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: #f44;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 0 0 20px rgba(255,0,0,0.8);
  display: none;
  text-align: center;
  pointer-events: none;
}
#gameOver span { font-size: 18px; color: #fff; display: block; margin-top: 10px; }
#controls {
  position: absolute;
  bottom: 10px; left: 10px;
  color: #666; font-size: 11px;
  pointer-events: none;
  line-height: 1.6;
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <div>🏆 得分: <span id="score">0</span></div>
    <div>❤️ 生命: <span id="lives">3</span></div>
    <div>💥 消灭: <span id="kills">0</span></div>
    <div>🎯 关卡: <span id="level">1</span></div>
  </div>
  <div id="gameOver">
    GAME OVER
    <span>按 R 重新开始</span>
  </div>
  <div id="controls">WASD/方向键 移动 | 空格/J 射击 | P 暂停</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 780, H = 580;
canvas.width = W; canvas.height = H;

// --- Audio ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol = 0.08) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function sfxShoot() { playSound(200, 'square', 0.12, 0.05); }
function sfxHit() { playSound(60, 'sawtooth', 0.2, 0.1); }
function sfxExplode() { playSound(40, 'sawtooth', 0.4, 0.15); }
function sfxPowerUp() { playSound(600, 'square', 0.15, 0.08); playSound(900, 'square', 0.15, 0.08); }

// --- Game State ---
const TILE = 40;
const COLS = W / TILE, ROWS = H / TILE;
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const dirDx = [0, 1, 0, -1];
const dirDy = [-1, 0, 1, 0];

let score = 0, lives = 3, kills = 0, level = 1;
let player, enemies = [], bullets = [], walls = [], powerUps = [];
let keys = {};
let gameRunning = true, paused = false;
let enemySpawnTimer = 0, powerUpTimer = 0;
let particles = [];

class Tank {
  constructor(x, y, dir, color, speed, hp = 1) {
    this.x = x; this.y = y; this.dir = dir;
    this.color = color; this.speed = speed;
    this.hp = hp; this.maxHp = hp;
    this.size = 16;
    this.cooldown = 0;
    this.fireRate = 40;
    this.alive = true;
    this.flash = 0;
  }
  getBounds() {
    return { x: this.x - this.size, y: this.y - this.size, w: this.size * 2, h: this.size * 2 };
  }
  draw() {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.dir * Math.PI / 2);
    // body
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.fillRect(-16, -13, 32, 26);
    // tracks
    ctx.fillStyle = '#222';
    ctx.fillRect(-18, -15, 6, 30);
    ctx.fillRect(12, -15, 6, 30);
    // tread marks
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    for (let i = -12; i < 16; i += 4) {
      ctx.beginPath(); ctx.moveTo(-15, i); ctx.lineTo(-12, i); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15, i); ctx.lineTo(12, i); ctx.stroke();
    }
    // barrel
    ctx.fillStyle = '#333';
    ctx.fillRect(-3, -22, 6, 20);
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.fillRect(-2, -22, 4, 18);
    // turret
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    // hp bar
    if (this.maxHp > 1) {
      ctx.rotate(-this.dir * Math.PI / 2);
      ctx.fillStyle = '#400';
      ctx.fillRect(-14, -20, 28, 4);
      ctx.fillStyle = '#0f0';
      ctx.fillRect(-14, -20, 28 * this.hp / this.maxHp, 4);
    }
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, owner) {
    this.x = x; this.y = y; this.dir = dir;
    this.speed = 5; this.owner = owner;
    this.alive = true; this.size = 3;
  }
  update() {
    this.x += dirDx[this.dir] * this.speed;
    this.y += dirDy[this.dir] * this.speed;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.alive = false;
    for (const w of walls) {
      if (!w.alive) continue;
      if (Math.abs(this.x - w.x - TILE/2) < TILE/2 + 3 && Math.abs(this.y - w.y - TILE/2) < TILE/2 + 3) {
        this.alive = false;
        if (w.hp) { w.hp--; if (w.hp <= 0) { w.alive = false; spawnParticles(w.x + TILE/2, w.y + TILE/2, '#964B00', 8); } }
      }
    }
  }
  draw() {
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type; // 'speed','fire','shield','multi'
    this.alive = true; this.timer = 600;
    this.size = 12;
  }
  update() { this.timer--; if (this.timer <= 0) this.alive = false; }
  draw() {
    const colors = { speed: '#0ff', fire: '#f80', shield: '#0f0', multi: '#f0f' };
    const icons = { speed: '⚡', fire: '🔥', shield: '🛡️', multi: '💠' };
    ctx.fillStyle = colors[this.type];
    ctx.shadowColor = colors[this.type]; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(icons[this.type], this.x, this.y + 5);
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 20, color });
  }
}

function rectCollide(a, b) {
  return Math.abs(a.x - b.x) < (a.size + b.size) && Math.abs(a.y - b.y) < (a.size + b.size);
}

function wallCollide(x, y, size) {
  if (x - size < 0 || x + size > W || y - size < 0 || y + size > H) return true;
  for (const w of walls) {
    if (!w.alive) continue;
    if (Math.abs(x - w.x - TILE/2) < TILE/2 + size && Math.abs(y - w.y - TILE/2) < TILE/2 + size) return true;
  }
  return false;
}

function tankCollide(ignore) {
  for (const e of enemies) {
    if (!e.alive || e === ignore) continue;
    if (rectCollide(ignore, e)) return true;
  }
  if (ignore !== player && player.alive && rectCollide(ignore, player)) return true;
  return false;
}

function generateLevel() {
  walls = [];
  enemies = [];
  bullets = [];
  powerUps = [];
  particles = [];
  // border walls
  for (let x = 0; x < COLS; x++) {
    walls.push({ x: x * TILE, y: 0, w: TILE, h: TILE, alive: true, hp: 0 });
    walls.push({ x: x * TILE, y: H - TILE, w: TILE, h: TILE, alive: true, hp: 0 });
  }
  for (let y = 1; y < ROWS - 1; y++) {
    walls.push({ x: 0, y: y * TILE, w: TILE, h: TILE, alive: true, hp: 0 });
    walls.push({ x: W - TILE, y: y * TILE, w: TILE, h: TILE, alive: true, hp: 0 });
  }
  // random obstacles
  const numBlocks = 20 + level * 5;
  for (let i = 0; i < numBlocks; i++) {
    const cx = 2 + Math.floor(Math.random() * (COLS - 4));
    const cy = 2 + Math.floor(Math.random() * (ROWS - 4));
    const cx2 = Math.floor(player.x / TILE), cy2 = Math.floor(player.y / TILE);
    if (Math.abs(cx - cx2) < 3 && Math.abs(cy - cy2) < 3) continue;
    let dup = false;
    for (const w of walls) {
      if (Math.abs(w.x / TILE - cx) < 1 && Math.abs(w.y / TILE - cy) < 1) { dup = true; break; }
    }
    if (!dup) {
      walls.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, alive: true, hp: Math.random() < 0.3 ? 2 : 1 });
    }
  }
  // player
  player.x = TILE * 1.5; player.y = TILE * 1.5;
  player.dir = DIR.DOWN; player.alive = true; player.cooldown = 0;
  player.speed = 1.8; player.fireRate = 35; player.shield = 0; player.multiShot = false;
  // spawn enemies
  enemySpawnTimer = 80;
  for (let i = 0; i < 3 + level; i++) spawnEnemy();
}

function spawnEnemy() {
  const sides = [
    { x: Math.random() * W, y: TILE },
    { x: Math.random() * W, y: H - TILE },
    { x: TILE, y: Math.random() * H },
    { x: W - TILE, y: Math.random() * H },
  ];
  const s = sides[Math.floor(Math.random() * 4)];
  if (wallCollide(s.x, s.y, 18)) return;
  const hp = level >= 5 ? (Math.random() < 0.3 ? 2 : 1) : 1;
  const speed = 0.6 + Math.random() * 0.5 + level * 0.05;
  const colors = ['#e44', '#f84', '#e4e', '#4af', '#4f4'];
  enemies.push(new Tank(s.x, s.y, Math.floor(Math.random() * 4), colors[Math.floor(Math.random() * colors.length)], Math.min(speed, 2), hp));
}

function fireBullet(tank, owner) {
  const bx = tank.x + dirDx[tank.dir] * 20;
  const by = tank.y + dirDy[tank.dir] * 20;
  bullets.push(new Bullet(bx, by, tank.dir, owner));
  if (owner === 'player' && player.multiShot) {
    bullets.push(new Bullet(bx, by, (tank.dir + 1) % 4, owner));
    bullets.push(new Bullet(bx, by, (tank.dir + 3) % 4, owner));
  }
}

function hitEnemy(enemy) {
  enemy.hp--;
  enemy.flash = 6;
  if (enemy.hp <= 0) {
    enemy.alive = false;
    kills++;
    score += 100;
    spawnParticles(enemy.x, enemy.y, enemy.color, 15);
    sfxExplode();
    if (Math.random() < 0.2) {
      const types = ['speed','fire','shield','multi'];
      powerUps.push(new PowerUp(enemy.x, enemy.y, types[Math.floor(Math.random() * types.length)]));
    }
  } else {
    sfxHit();
  }
}

// --- Init ---
player = new Tank(TILE * 1.5, TILE * 1.5, DIR.DOWN, '#0f0', 1.8);
generateLevel();

// --- Input ---
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') { if (!gameRunning) resetGame(); }
  if (e.key === 'p' || e.key === 'P') { paused = !paused; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'j' || e.key === 'J') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function resetGame() {
  score = 0; lives = 3; kills = 0; level = 1;
  enemies = []; bullets = []; powerUps = []; particles = [];
  player = new Tank(TILE * 1.5, TILE * 1.5, DIR.DOWN, '#0f0', 1.8);
  generateLevel();
  gameRunning = true;
  document.getElementById('gameOver').style.display = 'none';
}

function updatePlayer() {
  if (!player.alive) return;
  let moveX = 0, moveY = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) moveY = -1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) moveY = 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) moveX = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) moveX = 1;

  if (moveX !== 0 || moveY !== 0) {
    if (Math.abs(moveX) > 0 && Math.abs(moveY) > 0) { moveX *= 0.707; moveY *= 0.707; }
    const nx = player.x + moveX * player.speed;
    const ny = player.y + moveY * player.speed;
    if (!wallCollide(nx, player.y, player.size)) player.x = nx;
    if (!wallCollide(player.x, ny, player.size)) player.y = ny;
    if (Math.abs(moveX) > Math.abs(moveY)) player.dir = moveX > 0 ? DIR.RIGHT : DIR.LEFT;
    else if (Math.abs(moveY) > 0) player.dir = moveY > 0 ? DIR.DOWN : DIR.UP;
    // tank collision
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectCollide(player, e)) {
        player.x -= moveX * player.speed;
        player.y -= moveY * player.speed;
      }
    }
  }
  if (player.cooldown > 0) player.cooldown--;
  if ((keys[' '] || keys['j'] || keys['J']) && player.cooldown <= 0) {
    fireBullet(player, 'player');
    player.cooldown = player.fireRate;
    sfxShoot();
  }
  if (player.flash > 0) player.flash--;
}

function updateEnemies() {
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    if (enemy.flash > 0) enemy.flash--;
    // AI
    if (Math.random() < 0.02) enemy.dir = Math.floor(Math.random() * 4);
    const nx = enemy.x + dirDx[enemy.dir] * enemy.speed;
    const ny = enemy.y + dirDy[enemy.dir] * enemy.speed;
    if (!wallCollide(nx, enemy.y, enemy.size) && !tankCollide(enemy)) enemy.x = nx;
    else enemy.dir = Math.floor(Math.random() * 4);
    if (!wallCollide(enemy.x, ny, enemy.size) && !tankCollide(enemy)) enemy.y = ny;
    else enemy.dir = Math.floor(Math.random() * 4);
    // shoot towards player
    if (enemy.cooldown > 0) enemy.cooldown--;
    if (enemy.cooldown <= 0) {
      const dx = player.x - enemy.x, dy = player.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 300) {
        if (Math.abs(dx) > Math.abs(dy)) enemy.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
        else enemy.dir = dy > 0 ? DIR.DOWN : DIR.UP;
        fireBullet(enemy, 'enemy');
        enemy.cooldown = 50 + Math.random() * 40;
      }
    }
  }
}

function updateBullets() {
  for (const b of bullets) {
    if (!b.alive) continue;
    b.update();
    if (!b.alive) continue;
    if (b.owner === 'player') {
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        if (Math.abs(b.x - enemy.x) < enemy.size && Math.abs(b.y - enemy.y) < enemy.size) {
          b.alive = false; hitEnemy(enemy); break;
        }
      }
    } else {
      if (!player.alive) continue;
      if (Math.abs(b.x - player.x) < player.size && Math.abs(b.y - player.y) < player.size) {
        b.alive = false;
        if (player.shield > 0) {
          player.shield--;
          sfxHit();
        } else {
          player.alive = false;
          spawnParticles(player.x, player.y, '#0f0', 20);
          sfxExplode();
          lives--;
          if (lives <= 0) { gameRunning = false; }
          else { setTimeout(() => { player.alive = true; player.x = TILE * 1.5; player.y = TILE * 1.5; player.shield = 90; }, 1000); }
        }
      }
    }
  }
  bullets = bullets.filter(b => b.alive);
}

function updatePowerUps() {
  for (const p of powerUps) {
    if (!p.alive) continue;
    p.update();
    if (!p.alive) continue;
    if (player.alive && Math.abs(p.x - player.x) < 22 && Math.abs(p.y - player.y) < 22) {
      p.alive = false; sfxPowerUp();
      switch (p.type) {
        case 'speed': player.speed = 3; setTimeout(() => player.speed = 1.8, 8000); break;
        case 'fire': player.fireRate = 15; setTimeout(() => player.fireRate = 35, 8000); break;
        case 'shield': player.shield = 3; break;
        case 'multi': player.multiShot = true; setTimeout(() => player.multiShot = false, 8000); break;
      }
    }
  }
  powerUps = powerUps.filter(p => p.alive);
}

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function drawWalls() {
  for (const w of walls) {
    if (!w.alive) continue;
    if (w.hp === 0) {
      ctx.fillStyle = '#555';
      ctx.fillRect(w.x, w.y, TILE, TILE);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 1, w.y + 1, TILE - 2, TILE - 2);
    } else {
      ctx.fillStyle = w.hp > 1 ? '#8B4513' : '#964B00';
      ctx.fillRect(w.x, w.y, TILE, TILE);
      ctx.strokeStyle = '#654321';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x + 1, w.y + 1, TILE - 2, TILE - 2);
      // brick pattern
      ctx.fillStyle = '#7a3a00';
      ctx.fillRect(w.x + 4, w.y + TILE/2 - 1, TILE - 8, 2);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawShield() {
  if (player.alive && player.shield > 0) {
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function nextLevel() {
  level++;
  player.x = TILE * 1.5; player.y = TILE * 1.5;
  player.alive = true; player.shield = 90;
  player.speed = 1.8; player.fireRate = 35; player.multiShot = false;
  enemies = []; bullets = []; powerUps = []; particles = [];
  generateLevel();
}

// --- Main Loop ---
function update() {
  if (!gameRunning || paused) return;
  updatePlayer();
  updateEnemies();
  updateBullets();
  updatePowerUps();
  updateParticles();
  enemies = enemies.filter(e => e.alive);
  walls = walls.filter(w => w.alive);
  // spawn timer
  enemySpawnTimer--;
  if (enemySpawnTimer <= 0 && enemies.length < 4 + level) {
    spawnEnemy();
    enemySpawnTimer = 120 + Math.random() * 100;
  }
  // check level complete
  if (enemies.length === 0 && enemySpawnTimer < 40) {
    score += 200;
    nextLevel();
  }
  // update UI
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('kills').textContent = kills;
  document.getElementById('level').textContent = level;
  if (!gameRunning) {
    document.getElementById('gameOver').style.display = 'block';
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // grid
  ctx.strokeStyle = '#1a2a1a';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += TILE) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += TILE) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  drawWalls();
  for (const p of powerUps) { if (p.alive) p.draw(); }
  for (const b of bullets) { if (b.alive) b.draw(); }
  for (const e of enemies) e.draw();
  if (player.alive) player.draw();
  drawShield();
  drawParticles();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '40px monospace'; ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停中', W/2, H/2);
  }
}

function gameLoop() {
  update(); draw(); requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
