<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#gameContainer {
  position: relative;
  border: 3px solid #555;
  border-radius: 6px;
  box-shadow: 0 0 40px rgba(0,150,0,0.3);
}
canvas { display: block; background: #1a1a1a; }
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #0f0;
  font-size: 14px;
  pointer-events: none;
  line-height: 1.8;
  text-shadow: 0 0 6px rgba(0,255,0,0.6);
}
#gameOver {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: #f44;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 0 0 20px rgba(255,0,0,0.8);
  display: none;
  text-align: center;
  pointer-events: none;
  background: rgba(0,0,0,0.7);
  padding: 30px 50px;
  border-radius: 10px;
}
#gameOver span { font-size: 16px; color: #fff; display: block; margin-top: 10px; }
#controls {
  position: absolute;
  bottom: 10px; left: 10px;
  color: #888; font-size: 11px;
  pointer-events: none;
  line-height: 1.6;
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <div>得分: <span id="score">0</span></div>
    <div>生命: <span id="lives">3</span></div>
    <div>消灭: <span id="kills">0</span></div>
    <div>关卡: <span id="level">1</span></div>
  </div>
  <div id="gameOver">
    GAME OVER
    <span>按 R 重新开始</span>
  </div>
  <div id="controls">WASD/方向键 移动 | 空格/J 射击 | P 暂停</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 40;
const COLS = 19, ROWS = 14;
const W = COLS * TILE, H = ROWS * TILE;
canvas.width = W; canvas.height = H;

// --- Simple Audio (try/catch for environments without AudioContext) ---
let audioCtx;
try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
function playSound(freq, type, duration, vol = 0.06) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function sfxShoot() { playSound(200, 'square', 0.12, 0.04); }
function sfxHit() { playSound(60, 'sawtooth', 0.2, 0.08); }
function sfxExplode() { playSound(40, 'sawtooth', 0.4, 0.12); }
function sfxPowerUp() { playSound(600, 'square', 0.15, 0.06); playSound(900, 'square', 0.15, 0.06); }

// --- Game State ---
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const dirDx = [0, 1, 0, -1];
const dirDy = [-1, 0, 1, 0];

let score = 0, lives = 3, kills = 0, level = 1;
let player, enemies = [], bullets = [], walls = [], powerUps = [];
let keys = {};
let gameRunning = true, paused = false;
let enemySpawnTimer = 0;
let particles = [];

// --- Classes ---
class Tank {
  constructor(x, y, dir, color, speed, hp = 1) {
    this.x = x; this.y = y; this.dir = dir;
    this.color = color; this.speed = speed;
    this.hp = hp; this.maxHp = hp;
    this.size = 14;
    this.cooldown = 0;
    this.fireRate = 40;
    this.alive = true;
    this.flash = 0;
  }
  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.dir * Math.PI / 2);
    // tracks
    ctx.fillStyle = '#111';
    ctx.fillRect(-16, -14, 6, 28);
    ctx.fillRect(10, -14, 6, 28);
    // track marks
    ctx.fillStyle = '#333';
    for (let i = -12; i < 14; i += 5) {
      ctx.fillRect(-15, i, 4, 2);
      ctx.fillRect(11, i, 4, 2);
    }
    // body
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.fillRect(-10, -12, 20, 24);
    // barrel
    ctx.fillStyle = '#222';
    ctx.fillRect(-2, -24, 4, 20);
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.fillRect(-1.5, -24, 3, 20);
    // turret (circle on top)
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.stroke();
    // center dot
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    // hp bar (only for multi-hp tanks)
    if (this.maxHp > 1) {
      ctx.rotate(-this.dir * Math.PI / 2);
      ctx.fillStyle = '#400';
      ctx.fillRect(-14, -18, 28, 3);
      ctx.fillStyle = '#0f0';
      ctx.fillRect(-14, -18, 28 * this.hp / this.maxHp, 3);
    }
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, owner) {
    this.x = x; this.y = y; this.dir = dir;
    this.speed = 5; this.owner = owner;
    this.alive = true; this.size = 2;
  }
  update() {
    this.x += dirDx[this.dir] * this.speed;
    this.y += dirDy[this.dir] * this.speed;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) { this.alive = false; return; }
    for (const w of walls) {
      if (!w.alive) continue;
      if (this.x > w.x && this.x < w.x + TILE && this.y > w.y && this.y < w.y + TILE) {
        this.alive = false;
        if (w.hp > 0) { w.hp--; if (w.hp <= 0) { w.alive = false; spawnParticles(w.x + TILE/2, w.y + TILE/2, '#964B00', 10); } }
        return;
      }
    }
  }
  draw(ctx) {
    if (!this.alive) return;
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size + 1, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.alive = true;
    this.timer = 500;
    this.size = 12;
  }
  update() { this.timer--; if (this.timer <= 0) this.alive = false; }
  draw(ctx) {
    if (!this.alive) return;
    const colors = { speed: '#0cf', fire: '#f80', shield: '#0f0', multi: '#f0f' };
    const labels = { speed: 'S', fire: 'F', shield: 'D', multi: 'M' };
    ctx.fillStyle = colors[this.type];
    ctx.shadowColor = colors[this.type]; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[this.type], this.x, this.y);
  }
}

// --- Helpers ---
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 15 + Math.random() * 20, color });
  }
}

function rectCollide(a, b) {
  return Math.abs(a.x - b.x) < (a.size + b.size) && Math.abs(a.y - b.y) < (a.size + b.size);
}

function wallCollide(x, y, size) {
  if (x - size < 0 || x + size > W || y - size < 0 || y + size > H) return true;
  for (const w of walls) {
    if (!w.alive) continue;
    if (x + size > w.x && x - size < w.x + TILE && y + size > w.y && y - size < w.y + TILE) return true;
  }
  return false;
}

function tankCollideOther(tank) {
  for (const e of enemies) {
    if (!e.alive || e === tank) continue;
    if (rectCollide(tank, e)) return true;
  }
  if (tank !== player && player.alive && rectCollide(tank, player)) return true;
  return false;
}

// --- Level Generation ---
function generateLevel() {
  walls = [];
  enemies = [];
  bullets = [];
  powerUps = [];
  particles = [];

  // Border walls (indestructible)
  for (let x = 0; x < COLS; x++) {
    walls.push({ x: x * TILE, y: 0, w: TILE, h: TILE, alive: true, hp: 0 });
    walls.push({ x: x * TILE, y: (ROWS - 1) * TILE, w: TILE, h: TILE, alive: true, hp: 0 });
  }
  for (let y = 1; y < ROWS - 1; y++) {
    walls.push({ x: 0, y: y * TILE, w: TILE, h: TILE, alive: true, hp: 0 });
    walls.push({ x: (COLS - 1) * TILE, y: y * TILE, w: TILE, h: TILE, alive: true, hp: 0 });
  }

  // Random obstacles (avoid spawning near player start)
  const numBlocks = 25 + level * 5;
  const playerTileX = 1, playerTileY = 1;
  for (let i = 0; i < numBlocks; i++) {
    const cx = 2 + Math.floor(Math.random() * (COLS - 4));
    const cy = 2 + Math.floor(Math.random() * (ROWS - 4));
    // Keep area near player spawn clear
    if (Math.abs(cx - playerTileX) <= 1 && Math.abs(cy - playerTileY) <= 1) continue;
    // Don't stack on existing wall
    let dup = false;
    for (const w of walls) {
      if (w.x === cx * TILE && w.y === cy * TILE) { dup = true; break; }
    }
    if (!dup) {
      walls.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, alive: true, hp: Math.random() < 0.35 ? 2 : 1 });
    }
  }

  // Reset player
  player.x = TILE + TILE / 2;  // center of tile (1,1)
  player.y = TILE + TILE / 2;
  player.dir = DIR.DOWN;
  player.alive = true;
  player.cooldown = 0;
  player.speed = 1.8;
  player.fireRate = 35;
  player.shield = 0;
  player.multiShot = false;

  // Spawn initial enemies
  enemySpawnTimer = 60;
  for (let i = 0; i < 3 + level; i++) spawnEnemy();
}

function spawnEnemy() {
  // Spawn from edges but INSIDE the border walls
  // Left edge: x = TILE + TILE/2 (column 1 center)
  // Right edge: x = (COLS-2)*TILE + TILE/2
  // Top edge: y = TILE + TILE/2
  // Bottom edge: y = (ROWS-2)*TILE + TILE/2

  const margin = TILE + TILE / 2; // 60px from edge - inside border
  const spawns = [
    { x: margin + Math.random() * (W - margin * 2), y: margin },
    { x: margin + Math.random() * (W - margin * 2), y: H - margin },
    { x: margin, y: margin + Math.random() * (H - margin * 2) },
    { x: W - margin, y: margin + Math.random() * (H - margin * 2) },
  ];
  const s = spawns[Math.floor(Math.random() * 4)];
  if (wallCollide(s.x, s.y, Tank.prototype.size)) return;

  const hp = level >= 4 ? (Math.random() < 0.3 ? 2 : 1) : 1;
  const speed = 0.7 + Math.random() * 0.4 + level * 0.04;
  const colors = ['#e33', '#f84', '#e4e', '#4af', '#f80', '#e22'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  enemies.push(new Tank(s.x, s.y, Math.floor(Math.random() * 4), color, Math.min(speed, 2), hp));
}

// --- Actions ---
function fireBullet(tank, owner) {
  const bx = tank.x + dirDx[tank.dir] * (tank.size + 4);
  const by = tank.y + dirDy[tank.dir] * (tank.size + 4);
  bullets.push(new Bullet(bx, by, tank.dir, owner));
  if (owner === 'player' && player.multiShot) {
    bullets.push(new Bullet(bx, by, (tank.dir + 1) % 4, owner));
    bullets.push(new Bullet(bx, by, (tank.dir + 3) % 4, owner));
  }
}

function hitEnemy(enemy) {
  enemy.hp--;
  enemy.flash = 5;
  if (enemy.hp <= 0) {
    enemy.alive = false;
    kills++;
    score += 100;
    spawnParticles(enemy.x, enemy.y, enemy.color, 15);
    sfxExplode();
    // 20% chance to drop power-up
    if (Math.random() < 0.2) {
      const types = ['speed', 'fire', 'shield', 'multi'];
      powerUps.push(new PowerUp(enemy.x, enemy.y, types[Math.floor(Math.random() * types.length)]));
    }
  } else {
    sfxHit();
  }
}

function resetGame() {
  score = 0; lives = 3; kills = 0; level = 1;
  enemies = []; bullets = []; powerUps = []; particles = [];
  generateLevel();
  gameRunning = true;
  document.getElementById('gameOver').style.display = 'none';
}

function nextLevel() {
  level++;
  player.x = TILE + TILE / 2;
  player.y = TILE + TILE / 2;
  player.alive = true;
  player.shield = 120;  // brief invulnerability
  player.speed = 1.8;
  player.fireRate = 35;
  player.multiShot = false;
  enemies = []; bullets = []; powerUps = []; particles = [];
  generateLevel();
}

// --- Update ---
function updatePlayer() {
  if (!player.alive) return;
  if (player.flash > 0) player.flash--;
  if (player.shield > 0) player.shield--;

  let mx = 0, my = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) my = -1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) my = 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) mx = 1;

  if (mx !== 0 || my !== 0) {
    if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }
    const nx = player.x + mx * player.speed;
    const ny = player.y + my * player.speed;
    if (!wallCollide(nx, player.y, player.size)) player.x = nx;
    if (!wallCollide(player.x, ny, player.size)) player.y = ny;
    // Direction
    if (Math.abs(mx) > Math.abs(my)) player.dir = mx > 0 ? DIR.RIGHT : DIR.LEFT;
    else player.dir = my > 0 ? DIR.DOWN : DIR.UP;
    // Push out of enemy tanks
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectCollide(player, e)) {
        player.x -= mx * player.speed;
        player.y -= my * player.speed;
      }
    }
  }

  if (player.cooldown > 0) player.cooldown--;
  if ((keys[' '] || keys['j'] || keys['J']) && player.cooldown <= 0) {
    fireBullet(player, 'player');
    player.cooldown = player.fireRate;
    sfxShoot();
  }
}

function updateEnemies() {
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    if (enemy.flash > 0) enemy.flash--;

    // Randomly change direction
    if (Math.random() < 0.015) enemy.dir = Math.floor(Math.random() * 4);

    // Move
    const nx = enemy.x + dirDx[enemy.dir] * enemy.speed;
    const ny = enemy.y + dirDy[enemy.dir] * enemy.speed;
    if (!wallCollide(nx, enemy.y, enemy.size) && !tankCollideOther(enemy)) enemy.x = nx;
    else enemy.dir = Math.floor(Math.random() * 4);
    if (!wallCollide(enemy.x, ny, enemy.size) && !tankCollideOther(enemy)) enemy.y = ny;
    else enemy.dir = Math.floor(Math.random() * 4);

    // Shooting AI - aim at player when close
    if (enemy.cooldown > 0) enemy.cooldown--;
    if (enemy.cooldown <= 0 && player.alive) {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 350) {
        if (Math.abs(dx) > Math.abs(dy)) enemy.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
        else enemy.dir = dy > 0 ? DIR.DOWN : DIR.UP;
        // Add some inaccuracy
        const offsetDir = (enemy.dir + (Math.random() < 0.3 ? (Math.random() < 0.5 ? 1 : 3) : 0)) % 4;
        const bullet = new Bullet(
          enemy.x + dirDx[offsetDir] * (enemy.size + 4),
          enemy.y + dirDy[offsetDir] * (enemy.size + 4),
          offsetDir, 'enemy'
        );
        bullets.push(bullet);
        enemy.cooldown = 50 + Math.random() * 50;
      }
    }
  }
}

function updateBullets() {
  for (const b of bullets) {
    if (!b.alive) continue;
    b.update();
    if (!b.alive) continue;

    if (b.owner === 'player') {
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        if (Math.abs(b.x - enemy.x) < enemy.size && Math.abs(b.y - enemy.y) < enemy.size) {
          b.alive = false;
          hitEnemy(enemy);
          break;
        }
      }
    } else {
      if (!player.alive || player.shield > 0) continue;
      if (Math.abs(b.x - player.x) < player.size && Math.abs(b.y - player.y) < player.size) {
        b.alive = false;
        player.alive = false;
        spawnParticles(player.x, player.y, '#0f0', 20);
        sfxExplode();
        lives--;
        if (lives <= 0) {
          gameRunning = false;
        } else {
          setTimeout(() => {
            if (gameRunning) {
              player.alive = true;
              player.x = TILE + TILE / 2;
              player.y = TILE + TILE / 2;
              player.shield = 90;
            }
          }, 1500);
        }
      }
    }
  }
  bullets = bullets.filter(b => b.alive);
}

function updatePowerUps() {
  for (const p of powerUps) {
    if (!p.alive) continue;
    p.update();
    if (!p.alive) continue;
    if (player.alive && Math.abs(p.x - player.x) < 22 && Math.abs(p.y - player.y) < 22) {
      p.alive = false;
      sfxPowerUp();
      switch (p.type) {
        case 'speed': player.speed = 2.8; setTimeout(() => { if (player.alive) player.speed = 1.8; }, 8000); break;
        case 'fire':  player.fireRate = 15; setTimeout(() => { if (player.alive) player.fireRate = 35; }, 8000); break;
        case 'shield': player.shield = player.shield + 180; break; // ~3 seconds
        case 'multi':  player.multiShot = true; setTimeout(() => { if (player.alive) player.multiShot = false; }, 8000); break;
      }
    }
  }
  powerUps = powerUps.filter(p => p.alive);
}

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

// --- Draw ---
function drawWalls() {
  for (const w of walls) {
    if (!w.alive) continue;
    if (w.hp === 0) {
      // Indestructible border
      ctx.fillStyle = '#444';
      ctx.fillRect(w.x, w.y, TILE, TILE);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x + 1, w.y + 1, TILE - 2, TILE - 2);
    } else if (w.hp === 1) {
      // Normal brick
      ctx.fillStyle = '#a0522d';
      ctx.fillRect(w.x, w.y, TILE, TILE);
      ctx.strokeStyle = '#8b4513';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x + 1, w.y + 1, TILE - 2, TILE - 2);
      // Brick lines
      ctx.strokeStyle = '#7a3700';
      ctx.beginPath();
      ctx.moveTo(w.x, w.y + TILE / 2); ctx.lineTo(w.x + TILE, w.y + TILE / 2);
      ctx.moveTo(w.x + TILE / 2, w.y); ctx.lineTo(w.x + TILE / 2, w.y + TILE / 2);
      ctx.stroke();
    } else {
      // Harder brick (needs 2 shots)
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(w.x, w.y, TILE, TILE);
      ctx.strokeStyle = '#654321';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x + 1, w.y + 1, TILE - 2, TILE - 2);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / 35;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Ground grid
  ctx.strokeStyle = '#1a2a1a';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x += TILE) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += TILE) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  drawWalls();
  for (const p of powerUps) p.draw(ctx);
  for (const b of bullets) b.draw(ctx);
  for (const e of enemies) e.draw(ctx);
  if (player.alive) player.draw(ctx);

  // Shield effect around player
  if (player.alive && player.shield > 0) {
    ctx.strokeStyle = 'rgba(0,255,255,' + (0.4 + Math.sin(Date.now() / 100) * 0.3) + ')';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  drawParticles();

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中 - P 继续', W / 2, H / 2);
  }
}

// --- Main Loop ---
function update() {
  if (!gameRunning || paused) return;

  updatePlayer();
  updateEnemies();
  updateBullets();
  updatePowerUps();
  updateParticles();

  // Cleanup
  enemies = enemies.filter(e => e.alive);
  walls = walls.filter(w => w.alive);

  // Spawn timer
  enemySpawnTimer--;
  if (enemySpawnTimer <= 0 && enemies.length < 5 + level) {
    spawnEnemy();
    enemySpawnTimer = 100 + Math.random() * 120;
  }

  // Level complete check
  if (enemies.length === 0 && enemySpawnTimer < 30) {
    score += 200;
    nextLevel();
  }

  // Update UI
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('kills').textContent = kills;
  document.getElementById('level').textContent = level;

  if (!gameRunning) {
    document.getElementById('gameOver').style.display = 'block';
  }
}

// --- Input ---
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === 'r' || e.key === 'R') && !gameRunning) resetGame();
  if (e.key === 'p' || e.key === 'P') { paused = !paused; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'j' || e.key === 'J') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// --- Init ---
player = new Tank(TILE + TILE / 2, TILE + TILE / 2, DIR.DOWN, '#3d3', 1.8);
generateLevel();

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
